stages:
  - build       # Étape pour construire le projet
  - deploy      # Étape pour le déploiement

variables:
  NODE_VERSION: "22"

before_script:
  - apt-get update -y
  - apt-get install -y openssh-client

# Job de construction
build-job:
  stage: build
  image: node:$NODE_VERSION
  script:
    - npm install
    - npm run generate
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Job de déploiement
deploy-to-vps:
  stage: deploy
  only:
    - main  # Exécute ce job seulement pour la branche `main`
  script:
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
    - ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "sudo rm -rf /var/www/portfolio/*"
    - scp -o StrictHostKeyChecking=no -r dist/* $VPS_USER@$VPS_HOST:/var/www/portfolio/
  dependencies:
    - build-job
  environment:
    name: production
    url: http://$VPS_HOST

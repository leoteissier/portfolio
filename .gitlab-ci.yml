stages:
  - build
  - deploy

# Variables for Docker, SSH, and the VPS
variables:
  DOCKER_IMAGE: "portfolio:latest"
  VPS_USER: $VPS_USER
  VPS_HOST: $VPS_HOST
  VPS_PATH: "/var/www"

build_job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker save $DOCKER_IMAGE | gzip > portfolio.tar.gz
  artifacts:
    paths:
      - portfolio.tar.gz

deploy_job:
  stage: deploy
  before_script:
    # Set up SSH key using $VPS_SSH_KEY
    - 'which ssh-agent || ( apk add --update openssh )'
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    # Copy the image to the server
    - scp portfolio.tar.gz $VPS_USER@$VPS_HOST:$VPS_PATH
    # Connect to the VPS and load the Docker image
    - ssh $VPS_USER@$VPS_HOST "cd $VPS_PATH && docker load -i portfolio.tar.gz"
    # Deploy the new container on the VPS
    - ssh $VPS_USER@$VPS_HOST "docker stop portfolio || true && docker rm portfolio || true && docker run -d --name portfolio -p 3000:3000 $DOCKER_IMAGE"

stages:
  - build
  - deploy

# Variables for Docker, SSH, and the VPS
variables:
  DOCKER_IMAGE: "portfolio:latest"
  VPS_USER: $VPS_USER
  VPS_HOST: $VPS_HOST
  VPS_PATH: "/var/www"
  DOCKER_IMAGE_PROD: "portfolio-app-prod"

build_job:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    # Construire l'image avec le Dockerfile de production
    - docker build -f Dockerfile.prod -t $DOCKER_IMAGE_PROD .
    # Sauvegarder l'image construite avec docker save
    - docker save $DOCKER_IMAGE_PROD | gzip > portfolio.tar.gz
  artifacts:
    paths:
      - portfolio.tar.gz

deploy_job:
  stage: deploy
  before_script:
    # Set up SSH key using $VPS_SSH_KEY
    - 'which ssh-agent || ( apk add --update openssh )'
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    # Copier l'image sur le serveur
    - scp portfolio.tar.gz $VPS_USER@$VPS_HOST:$VPS_PATH
    # Se connecter au VPS et charger l'image Docker
    - ssh $VPS_USER@$VPS_HOST "cd $VPS_PATH && docker load -i portfolio.tar.gz"
    # Déployer le nouveau conteneur sur le VPS
    - ssh $VPS_USER@$VPS_HOST "docker stop portfolio || true && docker rm portfolio || true && docker run -d --name portfolio -p 3000:3000 $DOCKER_IMAGE_PROD"

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "22"

before_script:
  - apt-get update -y
  - apt-get install -y openssh-client

build-job:
  stage: build
  image: node:$NODE_VERSION
  script:
    - npm install
    - npm run generate
    - ls -la dist/  # Vérification du contenu généré
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy-to-vps:
  stage: deploy
  only:
    - main
  script:
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
    - ls -la  # Affiche le contenu du répertoire de travail
    - ls -la dist/  # Affiche le contenu du répertoire dist/ pour confirmer la présence des fichiers
    - if [ -z "$(ls -A dist)" ]; then echo "Le répertoire dist est vide. Annulation du déploiement."; exit 1; fi
    - cd $CI_PROJECT_DIR  # Changer le répertoire de travail pour s'assurer qu'il est correct
    - ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "sudo rm -rf /var/www/portfolio/*"
    - scp -o StrictHostKeyChecking=no -r ./dist/* $VPS_USER@$VPS_HOST:/var/www/portfolio/
  dependencies:
    - build-job
  artifacts:
    paths:
      - dist/
  environment:
    name: production
    url: http://$VPS_HOST
